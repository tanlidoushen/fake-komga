version: "3.8"

services:
  # ========== 本地文件系统后端 ==========
  fake-komga-local:
    build:
      context: ../fake-komga-local
      dockerfile: Dockerfile
    container_name: fake-komga-local
    ports:
      - "25604:25600"
    volumes:
      - ${COMICS_DIR:-./comics}:/comics:ro
      - fk-local-data:/data
    environment:
      - FK115_HOST=0.0.0.0
      - FK115_PORT=25600
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped

  # ========== Bangumi 元数据刮削器 ==========
  bangumi-metadata:
    build:
      context: ../bangumi-metadata
      dockerfile: Dockerfile
    container_name: bangumi-metadata
    ports:
      - "25601:25601"
    volumes:
      - fk-local-data:/data
    environment:
      - FK115_DB_PATH=/data/fake-komga-115.db
      - BANGUMI_ACCESS_TOKEN=${BANGUMI_ACCESS_TOKEN:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,fake-komga-local,bangumi-metadata
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      - fake-komga-local
    restart: unless-stopped

volumes:
  fk-local-data: